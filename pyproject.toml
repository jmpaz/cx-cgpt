[project]
name = "cx-chats"
version = "0.1.0"
description = "ChatGPT and claude.ai conversation sources for contextualize"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "click>=8.1",
  "cryptography>=42",
  "secretstorage>=3.3; sys_platform == 'linux'",
]

[project.entry-points."contextualize.plugins"]
chatgpt = "cx_chats.chatgpt.plugin"
claude = "cx_chats.claude.plugin"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
